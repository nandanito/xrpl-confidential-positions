# W-CONF loopback ledger source — architecture §6 step 7, CLAIMS.md B-15.
#
# The facility's ledger reads MUST go to a node the operator runs. This is that
# node: rippled 3.3.0 (git 00a178f — the SAME commit CLAIMS.md F-23 was read
# at), syncing the XRPL Devnet, published on 127.0.0.1 only.
#
# ⚠ This is not a hardened deployment and is not meant to be one. It is a
# Devnet research node. admin RPC is open to the container's network because the
# port is published to loopback only; do not publish it anywhere else.

[server]
port_rpc_admin_local
port_ws_admin_local
port_peer

[port_rpc_admin_local]
port = 5005
ip = 0.0.0.0
admin = 0.0.0.0
protocol = http

[port_ws_admin_local]
port = 6006
ip = 0.0.0.0
admin = 0.0.0.0
protocol = ws

[port_peer]
port = 51235
ip = 0.0.0.0
protocol = peer

# `tiny` could not keep up under x86 emulation. `small` gives bigger caches
# and fewer database round-trips, which is the half of the cost that is not CPU.
[node_size]
small

[node_db]
type=NuDB
path=/var/lib/rippled/db/nudb
online_delete=256
advisory_delete=0

[ledger_history]
256

[database_path]
/var/lib/rippled/db

[debug_logfile]
/var/log/rippled/debug.log

# ⚠ `r.devnet.rippletest.net 51235` — the hostname the Devnet documentation
# names as the peer hub — refused TCP from both this host and the container on
# 2026-08-25, while `s.devnet.rippletest.net:51235` accepted. Checked, not
# assumed: a peer list that does not connect is a node that never syncs, and
# rippled says only "Node count (0)" about it.
[ips]
s.devnet.rippletest.net 51235

# ⚠ A fresh node has to acquire a whole account state tree while Devnet keeps
# closing ledgers, and each attempt that does not finish is abandoned
# (`InboundLedger: … abort good:29130 dupe:822`). A FIXED peer is kept
# connected rather than rotated, which is the one lever a config has over that.
[ips_fixed]
s.devnet.rippletest.net 51235

# Devnet. network_id 2, verified against s.devnet.rippletest.net's server_info
# on 2026-08-25. NEVER change this to 0 or 1 — see CLAUDE.md's hard rule.
[network_id]
2

[validators_file]
validators.txt

[rpc_startup]
{ "command": "log_level", "severity": "warning" }

[ssl_verify]
1
