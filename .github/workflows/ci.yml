# Runs tools/ci.sh: everything that needs no vendored build. It does NOT run the
# signer's cargo test, check-test-support, check-zeroize-bounds or
# break-zeroize-lock, which need tools/rebuild-env.sh (a macOS build with
# Homebrew openssl@3), and it runs the secret sweep's shape classes only.
# tools/ci.sh prints that list at the end of every run.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # Pinned: ubuntu-latest began moving to Ubuntu 26 on 2026-10-19, and this is
    # the image the first public run passed on.
    runs-on: ubuntu-24.04
    steps:
      # Pinned by commit, not tag: a tag can be moved. v7.0.1 runs on Node 24;
      # v4.4.0 targeted the deprecated Node 20. Resolved 2026-10-19.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-claims-revisions and check-no-secrets read git history, and
          # check-no-secrets refuses a shallow clone.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: tools/ci.sh
