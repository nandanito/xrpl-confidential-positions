<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc" font-family="'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">The receivables facility, as it ran on Devnet</title>
  <desc id="desc">The facility's flow. Top row: the bank, which issues the token and reads every balance, funds the Dedicated Account, an ordinary account holding the float, with a public payment; the Dedicated Account makes one Convert of the whole float, amount public, so the float is now confidential. Middle, highlighted: drawdowns and repayments are Sends between the confidential float and suppliers A, B and C; the amounts are hidden from the public, and who and when are public; each supplier's limit, draws and what it owes are hidden from the public. Left: each supplier enrols with a small public payment and its own Convert, both amounts public. Bottom: at the end, what is left of the confidential float is retired in tranches, and each ConvertBack's amount is public, giving a public balance again. Footer: the public totals still bound the hidden amounts, and in a small enough book they can pin them exactly.</desc>

  <defs>
    <marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34374C"/>
    </marker>
    <marker id="a-tint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8c9e"/>
    </marker>
  </defs>

  <rect width="900" height="470" fill="#ffffff"/>

  <text x="450" y="38" text-anchor="middle" font-size="11" letter-spacing="2" fill="#777777">THE EXAMPLE · A CONFIDENTIAL RECEIVABLES FACILITY, AS IT RAN ON DEVNET</text>
  <text x="450" y="72" text-anchor="middle" font-size="23" font-weight="600" fill="#000000">It hides how much each supplier draws and owes, not who or when.</text>

  <!-- top row -->
  <rect rx="2" x="30" y="98" width="214" height="62" fill="#fafafa" stroke="#c8c8c8"/>
  <text x="137" y="124" text-anchor="middle" font-size="15" font-weight="600" fill="#000000">The bank</text>
  <text x="137" y="145" text-anchor="middle" font-size="12" font-weight="600" fill="#000000">issues the token; reads every balance</text>

  <line x1="246" y1="129" x2="330" y2="129" stroke="#8a8c9e" stroke-width="1.4" marker-end="url(#a-tint)"/>
  <text x="288" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#555555">funds it</text>
  <text x="288" y="146" text-anchor="middle" font-size="11" fill="#777777">amount public</text>

  <rect rx="2" x="334" y="98" width="230" height="62" fill="#fafafa" stroke="#c8c8c8"/>
  <text x="449" y="124" text-anchor="middle" font-size="15" font-weight="600" fill="#000000">The Dedicated Account</text>
  <text x="449" y="145" text-anchor="middle" font-size="12" fill="#555555">an ordinary account holding the float</text>

  <line x1="566" y1="129" x2="650" y2="129" stroke="#8a8c9e" stroke-width="1.4" marker-end="url(#a-tint)"/>
  <text x="608" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#555555">one Convert</text>
  <text x="608" y="146" text-anchor="middle" font-size="11" fill="#777777">amount public</text>

  <rect rx="2" x="654" y="98" width="216" height="62" fill="#fafafa" stroke="#34374C" stroke-width="1.6"/>
  <text x="762" y="124" text-anchor="middle" font-size="15" font-weight="600" fill="#34374C">The float, confidential</text>
  <text x="762" y="145" text-anchor="middle" font-size="12" fill="#555555">in the Dedicated Account</text>

  <!-- the hidden interior -->
  <line x1="762" y1="160" x2="762" y2="196" stroke="#34374C" stroke-width="1.6"/>
  <line x1="532" y1="196" x2="808" y2="196" stroke="#34374C" stroke-width="1.6"/>
  <line x1="532" y1="196" x2="532" y2="234" stroke="#34374C" stroke-width="1.6" marker-start="url(#a-accent)" marker-end="url(#a-accent)"/>
  <line x1="670" y1="196" x2="670" y2="234" stroke="#34374C" stroke-width="1.6" marker-start="url(#a-accent)" marker-end="url(#a-accent)"/>
  <line x1="808" y1="196" x2="808" y2="234" stroke="#34374C" stroke-width="1.6" marker-start="url(#a-accent)" marker-end="url(#a-accent)"/>
  <text x="512" y="196" text-anchor="end" font-size="13" font-weight="600" fill="#34374C">drawdowns and repayments: Sends, both ways</text>
  <text x="512" y="214" text-anchor="end" font-size="13" fill="#34374C">amounts hidden from the public; who and when public</text>

  <rect rx="2" x="470" y="238" width="124" height="62" fill="#ffffff" stroke="#c8c8c8"/>
  <text x="532" y="260" text-anchor="middle" font-size="14" font-weight="600" fill="#000000">Supplier A</text>
  <text x="532" y="277" text-anchor="middle" font-size="11" fill="#555555">limit, draws, debt:</text>
  <text x="532" y="291" text-anchor="middle" font-size="11" fill="#555555">hidden from the public</text>
  <rect rx="2" x="608" y="238" width="124" height="62" fill="#ffffff" stroke="#c8c8c8"/>
  <text x="670" y="260" text-anchor="middle" font-size="14" font-weight="600" fill="#000000">Supplier B</text>
  <text x="670" y="277" text-anchor="middle" font-size="11" fill="#555555">limit, draws, debt:</text>
  <text x="670" y="291" text-anchor="middle" font-size="11" fill="#555555">hidden from the public</text>
  <rect rx="2" x="746" y="238" width="124" height="62" fill="#ffffff" stroke="#c8c8c8"/>
  <text x="808" y="260" text-anchor="middle" font-size="14" font-weight="600" fill="#000000">Supplier C</text>
  <text x="808" y="277" text-anchor="middle" font-size="11" fill="#555555">limit, draws, debt:</text>
  <text x="808" y="291" text-anchor="middle" font-size="11" fill="#555555">hidden from the public</text>

  <!-- enrolment -->
  <rect rx="2" x="30" y="238" width="414" height="66" fill="#fafafa" stroke="#e5e5e5"/>
  <text x="48" y="258" font-size="11" letter-spacing="1.8" fill="#777777">ENROLMENT</text>
  <text x="48" y="279" font-size="13" fill="#000000">Each supplier enrols with a small public payment and its</text>
  <text x="48" y="295" font-size="13" fill="#000000">own Convert: both amounts public.</text>

  <!-- retirement -->
  <rect rx="2" x="30" y="330" width="250" height="56" fill="#fafafa" stroke="#c8c8c8"/>
  <text x="155" y="354" text-anchor="middle" font-size="14" font-weight="600" fill="#000000">At the end</text>
  <text x="155" y="373" text-anchor="middle" font-size="12" fill="#555555">what is left of the confidential float</text>
  <line x1="282" y1="358" x2="536" y2="358" stroke="#8a8c9e" stroke-width="1.4" marker-end="url(#a-tint)"/>
  <text x="409" y="349" text-anchor="middle" font-size="12" font-weight="600" fill="#555555">retired in tranches</text>
  <text x="409" y="376" text-anchor="middle" font-size="11" fill="#777777">each ConvertBack's amount public</text>
  <rect rx="2" x="540" y="330" width="200" height="56" fill="#fafafa" stroke="#c8c8c8"/>
  <text x="640" y="363" text-anchor="middle" font-size="14" font-weight="600" fill="#000000">A public balance again</text>

  <line x1="30" y1="410" x2="870" y2="410" stroke="#e5e5e5"/>
  <text x="450" y="438" text-anchor="middle" font-size="14" font-style="italic" fill="#555555">The public totals still bound the hidden amounts, and in a small enough book they can pin them exactly.</text>
</svg>
